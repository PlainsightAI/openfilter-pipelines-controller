name: Helm CRD Sync Check

on:
  pull_request:
    paths:
      - 'api/**'
      - 'internal/**'
      - 'config/crd/**'
      - 'config/rbac/**'
      - 'deployment/openfilter-pipelines-controller/crds/**'
      - 'deployment/openfilter-pipelines-controller/templates/rbac.yaml'
  push:
    branches:
      - main
    paths:
      - 'api/**'
      - 'internal/**'
      - 'config/crd/**'
      - 'config/rbac/**'

jobs:
  check-helm-crds:
    name: Check Helm CRDs are in sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Install controller-gen
        run: |
          make controller-gen

      - name: Generate CRDs and RBAC
        run: |
          make manifests

      - name: Check generated manifests are committed
        run: |
          git diff --exit-code config/ || \
          (echo "Error: config/ is out of sync with the kubebuilder markers. Please run 'make manifests' and commit the changes." && exit 1)

      - name: Update Helm CRDs
        run: |
          ./hack/update-helm-crds.sh

      - name: Update Helm RBAC
        run: |
          ./hack/update-helm-rbac.sh

      - name: Check for uncommitted changes
        run: |
          git diff --exit-code deployment/openfilter-pipelines-controller/ || \
          (echo "Error: the Helm chart is out of sync with the generated manifests. Please run 'make helm-update-crds helm-update-rbac' and commit the changes." && exit 1)

      - name: Verify Helm chart
        if: always()
        run: |
          # Install Helm
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

          # Update Helm dependencies
          cd deployment/openfilter-pipelines-controller
          helm dependency update

          # Lint the chart
          helm lint .

          # Template the chart to verify it renders correctly
          helm template test-release . --namespace pipelines-system > /dev/null
