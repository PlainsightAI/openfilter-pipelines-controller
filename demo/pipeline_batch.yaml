apiVersion: filter.plainsight.ai/v1alpha1
kind: Pipeline
metadata:
  name: pipeline-batch
spec:
  mode: batch
  sourcePath: /ws/input

  filters:
    - name: video-in
      image: plainsightai/openfilter-video-in:1.2.2
      resources:
        requests:
          cpu: "1"
        limits:
          cpu: "1"
      config:
        - name: sources
          value: file:///ws/input
        - name: outputs
          value: tcp://*:5550
      env:
        - name: LOG_LEVEL
          value: debug
    - name: image-out
      image: plainsightai/openfilter-image-out:1.3.0
      config:
        - name: sources
          value: tcp://localhost:5550
        - name: outputs
          value: "file:///ws/images_%Y%m%d_%H%M%S_%d.png"
        - name: bgr
          value: "true"
        - name: format
          value: "png"
        - name: quality
          value: "90"
        - name: compression
          value: "6"
